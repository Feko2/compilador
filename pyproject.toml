[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compilador"
version = "0.1.0"
description = "Compilador por fases (léxico primero), alineado con pruebas/ del curso."
requires-python = ">=3.9"
dependencies = ["lark>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
